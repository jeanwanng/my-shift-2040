<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#081222">

<title>B班・四班二輪 V6</title>

<style>
:root{
  --bg:#081222;
  --card:#0f1d31;
  --card2:#17263d;
  --line:#29405d;
  --text:#f5f7fb;
  --muted:#9eafc6;
  --blue:#2d6df6;
  --red:#ff7183;
  --orange:#ffa51f;
  --purple:#818cf8;
  --gray:#73869e;
  --green:#35d0a0;
  --offbg:#341d2a;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "PingFang TC","Noto Sans TC",sans-serif;
}

body{
  padding:
    max(14px,env(safe-area-inset-top))
    12px
    max(24px,env(safe-area-inset-bottom));
}

.app{
  max-width:720px;
  margin:auto;
}

h1{
  margin:4px 0 3px;
  font-size:25px;
}

.version{
  color:var(--green);
  font-weight:800;
  font-size:13px;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin:5px 0 15px;
  line-height:1.6;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:13px;
  margin-bottom:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);
}

.topbar{
  display:grid;
  grid-template-columns:48px 1fr 48px;
  gap:8px;
  align-items:center;
}

.monthTitle{
  text-align:center;
  font-size:20px;
  font-weight:900;
}

button,select,input,textarea{
  font:inherit;
}

button{
  border:1px solid var(--line);
  background:var(--card2);
  color:var(--text);
  border-radius:12px;
  min-height:42px;
  padding:8px 12px;
  font-weight:800;
}

button:active{
  transform:scale(.97);
}

.navbtn{
  font-size:22px;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.todayBtn{
  background:var(--blue);
  border-color:var(--blue);
}

select,input,textarea{
  width:100%;
  color:var(--text);
  background:#0a1728;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
}

.week{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:13px;
  margin-bottom:5px;
}

.week div{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  font-weight:800;
}

.week .sun,.week .sat{
  color:var(--red);
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.day{
  position:relative;
  min-height:91px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#0b1829;
  padding:6px 4px;
  overflow:hidden;
  text-align:center;
}

.day.empty{
  visibility:hidden;
}

.day.weekend .num{
  color:var(--red);
}

.day.off{
  background:var(--offbg);
  border-color:#69364a;
}

.day.holiday{
  box-shadow:inset 0 0 0 1px rgba(255,113,131,.45);
}

.day.today{
  outline:3px solid var(--blue);
  outline-offset:-2px;
}

.day.selected{
  box-shadow:0 0 0 2px var(--green);
}

.num{
  font-size:17px;
  font-weight:900;
  line-height:1.2;
}

.shift{
  display:inline-block;
  margin-top:5px;
  padding:3px 6px;
  border-radius:8px;
  font-size:11px;
  font-weight:900;
}

.shift.dayShift{
  background:rgba(255,165,31,.18);
  color:var(--orange);
  border:1px solid rgba(255,165,31,.5);
}

.shift.nightShift{
  background:rgba(129,140,248,.18);
  color:#b7beff;
  border:1px solid rgba(129,140,248,.55);
}

.shift.offShift{
  background:rgba(255,113,131,.12);
  color:var(--red);
  border:1px solid var(--red);
}

.lunar{
  margin-top:5px;
  color:var(--muted);
  font-size:9px;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.holidayName{
  color:var(--red);
  font-size:9px;
  font-weight:900;
  margin-top:3px;
  line-height:1.15;
}

.detailTitle{
  font-size:18px;
  font-weight:900;
  margin-bottom:8px;
}

.detailLine{
  padding:5px 0;
  color:#dce6f4;
  line-height:1.55;
}

.detailLine b{
  color:#fff;
}

.badge{
  display:inline-block;
  border-radius:9px;
  padding:4px 8px;
  font-size:12px;
  font-weight:900;
}

.badge.work{
  background:rgba(53,208,160,.15);
  color:var(--green);
}

.badge.off{
  background:rgba(255,113,131,.15);
  color:var(--red);
}

.sectionTitle{
  font-weight:900;
  margin-bottom:9px;
}

.settingGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
}

label input{
  margin-top:5px;
}

.note{
  min-height:90px;
  resize:vertical;
}

.small{
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
  margin-top:8px;
}

.legend{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}

.legend span{
  font-size:11px;
  color:var(--muted);
}

.dot{
  display:inline-block;
  width:9px;
  height:9px;
  border-radius:50%;
  margin-right:4px;
}

@media(max-width:390px){
  .day{
    min-height:84px;
    padding:5px 2px;
  }

  .num{font-size:16px}
  .shift{font-size:10px;padding:3px 4px}
  .lunar,.holidayName{font-size:8px}
}
</style>
</head>

<body>

<div class="app">

<h1>B班・四班二輪</h1>
<div class="version">V6 完整版</div>

<div class="subtitle">
做2休2・每兩個月日夜輪調<br>
早班 08:00–20:10 ／ 夜班 20:00–隔日 08:10
</div>

<div class="card">

  <div class="topbar">
    <button class="navbtn" onclick="changeMonth(-1)">‹</button>
    <div class="monthTitle" id="monthTitle"></div>
    <button class="navbtn" onclick="changeMonth(1)">›</button>
  </div>

  <div class="tools">
    <button class="todayBtn" onclick="goToday()">今天</button>
    <select id="yearSelect" onchange="jumpYear()"></select>
  </div>

  <div class="week">
    <div class="sun">日</div>
    <div>一</div>
    <div>二</div>
    <div>三</div>
    <div>四</div>
    <div>五</div>
    <div class="sat">六</div>
  </div>

  <div id="calendar" class="calendar"></div>

  <div class="legend">
    <span><i class="dot" style="background:#ffa51f"></i>早班</span>
    <span><i class="dot" style="background:#818cf8"></i>夜班</span>
    <span><i class="dot" style="background:#ff7183"></i>休假</span>
    <span><i class="dot" style="background:#2d6df6"></i>今天</span>
  </div>

</div>

<div class="card" id="detailCard">
  <div class="detailTitle" id="detailDate">選擇日期</div>
  <div id="detailContent" class="detailLine">
    點月曆中的日期即可查看當天班別。
  </div>
</div>

<div class="card">

  <div class="sectionTitle">⏰ 鬧鐘設定</div>

  <div class="settingGrid">

    <label>
      早班鬧鐘
      <input id="dayAlarm" type="time" value="05:50">
    </label>

    <label>
      夜班鬧鐘
      <input id="nightAlarm" type="time" value="17:50">
    </label>

  </div>

  <button style="width:100%;margin-top:10px"
          onclick="saveAlarm()">
    儲存鬧鐘時間
  </button>

  <div class="small">
    iPhone 網頁/PWA 無法像內建「時鐘」App 一樣在背景自行建立系統鬧鐘。
    這裡會保存你設定的提醒時間，方便查看上班日鬧鐘。
  </div>

</div>

<div class="card">

  <div class="sectionTitle">📝 當日記事</div>

  <textarea id="note"
            class="note"
            placeholder="輸入這一天的記事…"></textarea>

  <button style="width:100%;margin-top:8px"
          onclick="saveNote()">
    儲存記事
  </button>

</div>

</div>

<script>

/* =========================
   V6 基本設定
========================= */

const START_YEAR = 2026;
const END_YEAR   = 2040;

/*
  做2休2基準：
  2026/1/2、1/3 = 上班
  2026/1/4、1/5 = 休假
*/
const WORK_BASE = new Date(2026,0,2);

/* 現在顯示月份 */
let viewDate = new Date();

/* 選取日期 */
let selectedDate = new Date();

/* =========================
   工具
========================= */

function pad(n){
  return String(n).padStart(2,"0");
}

function keyOf(d){
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function sameDate(a,b){
  return a.getFullYear()===b.getFullYear() &&
         a.getMonth()===b.getMonth() &&
         a.getDate()===b.getDate();
}

function daysBetween(a,b){
  const x = Date.UTC(a.getFullYear(),a.getMonth(),a.getDate());
  const y = Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.floor((x-y)/86400000);
}

/* =========================
   做2休2
========================= */

function isWorkDay(date){

  let diff = daysBetween(date,WORK_BASE);

  let cycle = ((diff % 4) + 4) % 4;

  return cycle===0 || cycle===1;
}

/* =========================
   每兩個月輪班
   1-2 夜
   3-4 早
   5-6 夜
   7-8 早
   9-10 夜
   11-12 早
========================= */

function shiftType(date){

  if(!isWorkDay(date)){
    return "休假";
  }

  const m = date.getMonth()+1;

  if(
    m===1 || m===2 ||
    m===5 || m===6 ||
    m===9 || m===10
  ){
    return "夜班";
  }

  return "早班";
}

/* =========================
   國定假日
   固定日期 + V6 特別假日資料
========================= */

const specialHolidays = {

  /* 2026 */
  "2026-02-16":"春節假期",
  "2026-02-17":"春節",
  "2026-02-18":"春節假期",
  "2026-02-19":"春節假期",
  "2026-02-20":"春節假期",

  "2026-02-27":"和平紀念日補假",
  "2026-04-03":"兒童節補假",
  "2026-04-06":"清明節補假",
  "2026-06-19":"端午節",
  "2026-09-25":"中秋節",
  "2026-09-28":"教師節",
  "2026-10-09":"國慶日補假",
  "2026-10-25":"臺灣光復節",
  "2026-10-26":"光復節補假",
  "2026-12-25":"行憲紀念日",

  /* 2027 春節 */
  "2027-02-04":"春節假期",
  "2027-02-05":"春節假期",
  "2027-02-06":"除夕",
  "2027-02-07":"春節",
  "2027-02-08":"春節假期",
  "2027-02-09":"春節假期",
  "2027-02-10":"春節假期"
};

function fixedHoliday(date){

  const m = date.getMonth()+1;
  const d = date.getDate();

  if(m===1 && d===1) return "元旦";

  if(m===2 && d===28) return "和平紀念日";

  if(m===4 && d===4) return "兒童節";

  if(m===4 && d===5) return "清明節";

  if(m===5 && d===1) return "勞動節";

  if(m===9 && d===28) return "教師節";

  if(m===10 && d===10) return "國慶日";

  if(m===10 && d===25) return "臺灣光復節";

  if(m===12 && d===25) return "行憲紀念日";

  return "";
}

function holidayName(date){

  const key = keyOf(date);

  if(specialHolidays[key]){
    return specialHolidays[key];
  }

  return fixedHoliday(date);
}

/* =========================
   農曆
   使用 iPhone/Safari 內建
   Chinese Calendar
========================= */

function lunarText(date){

  try{

    const fmt = new Intl.DateTimeFormat(
      "zh-Hant-u-ca-chinese",
      {
        month:"short",
        day:"numeric"
      }
    );

    return fmt.format(date);

  }catch(e){

    return "";

  }
}

/* =========================
   節氣
   常用節氣日期近似顯示
========================= */

const solarTerms = {
  "01-05":"小寒",
  "01-20":"大寒",
  "02-04":"立春",
  "02-19":"雨水",
  "03-05":"驚蟄",
  "03-20":"春分",
  "04-04":"清明",
  "04-20":"穀雨",
  "05-05":"立夏",
  "05-21":"小滿",
  "06-05":"芒種",
  "06-21":"夏至",
  "07-07":"小暑",
  "07-22":"大暑",
  "08-07":"立秋",
  "08-23":"處暑",
  "09-07":"白露",
  "09-23":"秋分",
  "10-08":"寒露",
  "10-23":"霜降",
  "11-07":"立冬",
  "11-22":"小雪",
  "12-07":"大雪",
  "12-21":"冬至"
};

function solarTerm(date){

  const k =
    pad(date.getMonth()+1) +
    "-" +
    pad(date.getDate());

  return solarTerms[k] || "";
}

/* =========================
   月曆
========================= */

function renderCalendar(){

  const y = viewDate.getFullYear();
  const m = viewDate.getMonth();

  document.getElementById("monthTitle").textContent =
    y+" 年 "+(m+1)+" 月";

  document.getElementById("yearSelect").value = y;

  const box = document.getElementById("calendar");

  box.innerHTML="";

  const first = new Date(y,m,1);

  const startWeek = first.getDay();

  const total =
    new Date(y,m+1,0).getDate();

  for(let i=0;i<startWeek;i++){

    const empty=document.createElement("div");

    empty.className="day empty";

    box.appendChild(empty);

  }

  const today=new Date();

  for(let d=1;d<=total;d++){

    const date=new Date(y,m,d);

    const work=isWorkDay(date);

    const shift=shiftType(date);

    const holiday=holidayName(date);

    const lunar=lunarText(date);

    const term=solarTerm(date);

    const cell=document.createElement("div");

    cell.className="day";

    if(!work){
      cell.classList.add("off");
    }

    if(date.getDay()===0 || date.getDay()===6){
      cell.classList.add("weekend");
    }

    if(holiday){
      cell.classList.add("holiday");
    }

    if(sameDate(date,today)){
      cell.classList.add("today");
    }

    if(sameDate(date,selectedDate)){
      cell.classList.add("selected");
    }

    let shiftClass="offShift";

    if(shift==="早班"){
      shiftClass="dayShift";
    }

    if(shift==="夜班"){
      shiftClass="nightShift";
    }

    let lunarLine=lunar;

    if(term){
      lunarLine += "・"+term;
    }

    cell.innerHTML=`
      <div class="num">${d}</div>
      <div class="shift ${shiftClass}">
        ${shift}
      </div>
      <div class="lunar">
        ${lunarLine}
      </div>
      ${
        holiday
        ? `<div class="holidayName">${holiday}</div>`
        : ""
      }
    `;

    cell.onclick=()=>selectDate(date);

    box.appendChild(cell);
  }
}

/* =========================
   日期詳細資料
========================= */

function selectDate(date){

  selectedDate =
    new Date(
      date.getFullYear(),
      date.getMonth(),
      date.getDate()
    );

  renderCalendar();

  renderDetail();

  loadNote();
}

function renderDetail(){

  const d=selectedDate;

  const shift=shiftType(d);

  const holiday=holidayName(d);

  const lunar=lunarText(d);

  const term=solarTerm(d);

  const weekNames=[
    "星期日",
    "星期一",
    "星期二",
    "星期三",
    "星期四",
    "星期五",
    "星期六"
  ];

  document.getElementById("detailDate").textContent =
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekNames[d.getDay()]}`;

  let html="";

  if(shift==="休假"){

    html +=
      `<span class="badge off">休假</span>`;

    html +=
      `<div class="detailLine"><b>今天：</b>休假，不用上班</div>`;

  }

  if(shift==="早班"){

    html +=
      `<span class="badge work">早班・上班日</span>`;

    html +=
      `<div class="detailLine"><b>上班：</b>08:00</div>`;

    html +=
      `<div class="detailLine"><b>下班：</b>20:10</div>`;

    html +=
      `<div class="detailLine"><b>鬧鐘：</b>${getDayAlarm()}</div>`;

  }

  if(shift==="夜班"){

    html +=
      `<span class="badge work">夜班・上班日</span>`;

    html +=
      `<div class="detailLine"><b>上班：</b>20:00</div>`;

    html +=
      `<div class="detailLine"><b>下班：</b>隔日 08:10</div>`;

    html +=
      `<div class="detailLine"><b>鬧鐘：</b>${getNightAlarm()}</div>`;

  }

  html +=
    `<div class="detailLine"><b>農曆：</b>${lunar || "—"}</div>`;

  if(term){

    html +=
      `<div class="detailLine"><b>節氣：</b>${term}</div>`;

  }

  if(holiday){

    html +=
      `<div class="detailLine" style="color:var(--red)">
        <b>國定假日：</b>${holiday}
       </div>`;

  }

  document.getElementById("detailContent").innerHTML=html;
}

/* =========================
   上一月 / 下一月
========================= */

function changeMonth(n){

  let y=viewDate.getFullYear();

  let m=viewDate.getMonth()+n;

  const next=new Date(y,m,1);

  if(next.getFullYear()<START_YEAR){
    return;
  }

  if(next.getFullYear()>END_YEAR){
    return;
  }

  viewDate=next;

  renderCalendar();
}

/* =========================
   今天
========================= */

function goToday(){

  const t=new Date();

  viewDate=
    new Date(
      t.getFullYear(),
      t.getMonth(),
      1
    );

  selectedDate=
    new Date(
      t.getFullYear(),
      t.getMonth(),
      t.getDate()
    );

  renderCalendar();

  renderDetail();

  loadNote();
}

/* =========================
   年份
========================= */

function setupYears(){

  const sel=
    document.getElementById("yearSelect");

  sel.innerHTML="";

  for(let y=START_YEAR;y<=END_YEAR;y++){

    const op=document.createElement("option");

    op.value=y;

    op.textContent=y+" 年";

    sel.appendChild(op);
  }
}

function jumpYear(){

  const y=
    Number(
      document.getElementById("yearSelect").value
    );

  viewDate=
    new Date(
      y,
      viewDate.getMonth(),
      1
    );

  renderCalendar();
}

/* =========================
   鬧鐘
========================= */

function getDayAlarm(){

  return localStorage.getItem("B_DAY_ALARM")
    || "05:50";
}

function getNightAlarm(){

  return localStorage.getItem("B_NIGHT_ALARM")
    || "17:50";
}

function loadAlarm(){

  document.getElementById("dayAlarm").value =
    getDayAlarm();

  document.getElementById("nightAlarm").value =
    getNightAlarm();
}

function saveAlarm(){

  const day =
    document.getElementById("dayAlarm").value;

  const night =
    document.getElementById("nightAlarm").value;

  localStorage.setItem(
    "B_DAY_ALARM",
    day
  );

  localStorage.setItem(
    "B_NIGHT_ALARM",
    night
  );

  renderDetail();

  alert("鬧鐘時間已儲存");
}

/* =========================
   記事
========================= */

function noteKey(){

  return "B_NOTE_"+keyOf(selectedDate);
}

function loadNote(){

  document.getElementById("note").value =
    localStorage.getItem(noteKey())
    || "";
}

function saveNote(){

  const value =
    document.getElementById("note").value;

  localStorage.setItem(
    noteKey(),
    value
  );

  alert("記事已儲存");
}

/* =========================
   啟動
========================= */

setupYears();

loadAlarm();

goToday();

</script>

</body>
</html>
