<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#081222">
<title>四班二輪 V6.7 假日更新修正版</title>
<style>
:root{
  --bg:#081222;--card:#0f1d31;--line:#29405d;--text:#f5f7fb;--muted:#9eafc6;
  --blue:#2d6df6;--red:#ff5d70;--orange:#ffa51f;--purple:#818cf8;--gray:#73869e;
  --green:#35d0a0;--offbg:#ffe7ee;--holidaybg:#ffdce5;--weekendbg:#f7e5f7;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.wrap{max-width:760px;margin:auto;padding:calc(20px + env(safe-area-inset-top)) 10px calc(50px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:20px 4px}
h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:6px}
.theme{border:0;border-radius:18px;background:#17263d;color:white;padding:15px 18px;font-size:20px}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px;margin-bottom:18px}
.topbar,.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}.monthTitle{font-size:24px;font-weight:800}
.todayBtn,.primary{background:var(--blue);color:white;border:0;border-radius:18px;padding:13px 20px;font-weight:800}
.nav{margin-bottom:16px}.nav button{width:54px;height:54px;border:0;border-radius:17px;background:#17263d;color:white;font-size:25px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr)}.week{background:#02091a;border:1px solid #17263d}
.week div{text-align:center;padding:13px 2px;font-weight:800;font-size:18px}.week div:first-child,.week div:last-child{color:var(--red)}
.grid{margin-top:5px}
.day{position:relative;min-height:108px;border:1px solid rgba(75,98,130,.55);padding:7px 5px;overflow:hidden;background:rgba(255,255,255,.02)}
.day.empty{opacity:.15}.day.weekend{background:rgba(245,210,245,.08)}
.day.offDay{background:var(--offbg);color:#20242c}.day.offDay .lunar{color:#666}
.day.holiday{background:var(--holidaybg);color:#20242c}.day.holiday .lunar{color:#666}
.day.weekend .num,.day.holiday .num{color:#e7192d}
.day.selected{outline:3px solid var(--blue);outline-offset:-3px}.day.today{box-shadow:inset 0 0 0 3px #fff}
.num{font-size:19px;font-weight:900}.lunar{color:var(--muted);font-size:11px;margin-top:3px}
.shift{display:block;margin-top:7px;padding:5px 3px;border-radius:8px;font-size:12px;font-weight:900;text-align:center}
.shift.dayShift{background:#0866f5;color:white}.shift.nightShift{background:var(--purple);color:white}
.shift.off{background:#fff3f6;color:#e7192d;border:1.5px solid #ff4056;font-size:14px}
.shift.leave{background:#64748b;color:white}.shift.overtime{background:#f59e0b;color:#172033}
.statusBadge{font-size:10px;font-weight:900;margin-top:4px;text-align:center}.statusBadge.on{color:#059669}.statusBadge.off{color:#dc2626}
.holidayName{color:#e7192d;font-size:10px;line-height:1.2;margin-top:4px;font-weight:900}
.term{color:#0866f5;font-size:10px;margin-top:3px;font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;padding-top:15px;border-top:1px solid #52647a;color:var(--muted)}
.dot{width:14px;height:14px;display:inline-block;border-radius:4px;margin-right:5px;vertical-align:-2px}
.blue{background:#0866f5}.purple{background:var(--purple)}.pink{background:var(--offbg)}.red{background:var(--red)}.green{background:var(--green)}
h2{font-size:25px;margin:0 0 16px}.info{line-height:1.8;color:#dce6f4;margin-bottom:15px}.info strong{color:white}
.actions{display:flex;flex-wrap:wrap;gap:10px}.secondary{background:#17263d;color:white;border:0;border-radius:16px;padding:13px 18px;font-weight:700}
textarea{width:100%;min-height:130px;border:2px solid var(--line);background:#17263d;color:white;border-radius:18px;padding:15px;resize:vertical;margin-top:12px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:14px;background:#17263d;color:white;padding:12px}
.notice{color:var(--muted);font-size:13px;line-height:1.6;margin-top:14px}
.light{--bg:#eef3f9;--card:#fff;--line:#c8d5e5;--text:#152033;--muted:#64748b}
.light .theme,.light .nav button,.light .secondary,.light textarea,.light .field input,.light .field select{background:#e4ebf5;color:#152033}
.light .week{background:#e8eef7}.light .week div{color:#152033}.light .week div:first-child,.light .week div:last-child{color:#e7192d}
.light .day.today{box-shadow:inset 0 0 0 3px #111}.light .info{color:#334155}.light .info strong{color:#111827}
@media(max-width:520px){h1{font-size:25px}.card{padding:12px;border-radius:22px}.day{min-height:92px;padding:5px 3px}.num{font-size:17px}.lunar,.holidayName,.term{font-size:9px}.shift{font-size:10px}.shift.off{font-size:12px}.settings{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div><h1 id="appTitle">B班・四班二輪</h1><div class="sub"><span id="appSub">V6.7 假日更新修正版｜2做2休｜2026・2027官方假日｜至2040年</span></div></div><button class="theme" id="themeBtn">☀ / 🌙</button></header>
<section class="card">
<div class="topbar"><div class="monthTitle" id="monthTitle"></div><button class="todayBtn" id="todayBtn">今天</button></div>
<div class="nav" style="margin-top:14px"><button id="prev">‹</button><strong id="navTitle"></strong><button id="next">›</button></div>
<div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
<div class="grid" id="calendar"></div>
<div class="legend"><span><i class="dot blue"></i>早班</span><span><i class="dot purple"></i>夜班</span><span><i class="dot pink"></i>休假</span><span><i class="dot red"></i>國定假日／補假</span><span><i class="dot green"></i>節氣</span></div>
</section>
<section class="card"><h2>今日上班提醒</h2><div class="info" id="todayReminder"></div></section>
<section class="card"><h2>選擇日期</h2><div class="info" id="dateInfo">請點選月曆日期</div>
<div class="actions"><button class="primary" id="remindBtn">建立當天提醒</button><button class="secondary" id="leaveBtn">改請假</button><button class="secondary" id="overtimeBtn">改加班</button><button class="secondary" id="restoreDayBtn">恢復原班表</button><button class="secondary" id="saveNote">儲存記事</button></div>
<textarea id="note" placeholder="這一天的記事…"></textarea></section
