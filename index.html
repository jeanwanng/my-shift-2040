<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">

<title>B班班表 2040</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#080d18;
  color:#fff;
}
.app{
  max-width:520px;
  margin:auto;
  padding:env(safe-area-inset-top) 12px 30px;
}
h1{
  text-align:center;
  font-size:24px;
  margin:14px 0 5px;
}
.subtitle{
  text-align:center;
  color:#9aa8bd;
  font-size:13px;
  margin-bottom:15px;
}
.controls{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
button,select{
  border:0;
  border-radius:12px;
  padding:11px;
  font-size:16px;
  background:#172238;
  color:white;
}
button{cursor:pointer}
.todayBtn{
  background:#1677ff;
  font-weight:700;
}
.controls button{flex:1}
.controls select{flex:1}

.card{
  background:#111a2b;
  border:1px solid #26344d;
  border-radius:18px;
  padding:12px;
  margin-bottom:12px;
}
.monthTitle{
  text-align:center;
  font-size:21px;
  font-weight:700;
  margin:5px 0 12px;
}
.week,.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}
.week div{
  text-align:center;
  color:#93a2b8;
  font-size:13px;
  padding:4px 0;
}
.day{
  min-height:61px;
  background:#172238;
  border-radius:10px;
  padding:5px 2px;
  text-align:center;
  border:1px solid transparent;
  position:relative;
}
.day.empty{
  background:transparent;
}
.num{
  font-size:16px;
  font-weight:700;
}
.status{
  font-size:11px;
  margin-top:3px;
  white-space:nowrap;
}
.work{
  background:#17395a;
  border-color:#2587d9;
}
.work .status{
  color:#70c7ff;
  font-weight:700;
}
.rest .status{color:#7e8ca2}
.holiday{
  box-shadow:inset 0 0 0 2px #ef5350;
}
.holiday .num{color:#ff7676}
.today{
  outline:3px solid #ffd54f;
}
.lunar{
  font-size:9px;
  color:#aab5c5;
  margin-top:3px;
}
.info{
  line-height:1.8;
  font-size:15px;
}
.big{
  font-size:21px;
  font-weight:800;
  color:#6fc6ff;
}
.legend{
  display:flex;
  justify-content:center;
  gap:15px;
  font-size:12px;
  color:#aeb8c8;
  margin:8px 0 14px;
}
.dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:3px;
  margin-right:4px;
}
.blue{background:#2587d9}
.gray{background:#526176}
.red{background:#ef5350}
.yellow{background:#ffd54f}

.note{
  width:100%;
  min-height:70px;
  background:#0b1220;
  color:#fff;
  border:1px solid #2b3950;
  border-radius:12px;
  padding:10px;
  font-size:15px;
}
.small{
  font-size:12px;
  color:#9ba9bd;
}
</style>
</head>

<body>
<div class="app">

<h1>📅 B班班表</h1>
<div class="subtitle">做二休二・兩個月日夜輪替・至 2040 年</div>

<div class="controls">
  <button onclick="prevMonth()">◀</button>
  <button class="todayBtn" onclick="goToday()">今天</button>
  <button onclick="nextMonth()">▶</button>
</div>

<div class="controls">
  <select id="year" onchange="changeYM()"></select>
  <select id="month" onchange="changeYM()"></select>
</div>

<div class="card">
  <div id="monthTitle" class="monthTitle"></div>

  <div class="week">
    <div>日</div><div>一</div><div>二</div>
    <div>三</div><div>四</div><div>五</div><div>六</div>
  </div>

  <div id="calendar" class="calendar"></div>
</div>

<div class="legend">
  <span><i class="dot blue"></i>上班</span>
  <span><i class="dot gray"></i>休息</span>
  <span><i class="dot red"></i>假日</span>
  <span><i class="dot yellow"></i>今天</span>
</div>

<div class="card">
  <div id="detail" class="info">
    點日期查看當天班別與時間
  </div>
</div>

<div class="card">
  <b>⏰ 鬧鐘設定</b>
  <p>早班預設：05:50</p>
  <p>夜班預設：17:50</p>

  <div class="controls">
    <input id="dayAlarm" type="time" value="05:50"
      style="flex:1;padding:10px;border-radius:10px;border:0">
    <input id="nightAlarm" type="time" value="17:50"
      style="flex:1;padding:10px;border-radius:10px;border:0">
  </div>

  <button style="width:100%" onclick="saveAlarm()">儲存鬧鐘時間</button>

  <p class="small">
    iPhone 網頁無法直接替「時鐘 App」建立系統鬧鐘，
    這裡會保存你設定的時間供班表顯示。
  </p>
</div>

<div class="card">
  <b>📝 今日記事</b>
  <textarea id="note" class="note"
    placeholder="輸入記事…"></textarea>
  <button style="width:100%;margin-top:8px"
    onclick="saveNote()">儲存記事</button>
</div>

</div>

<script>
const holidays = {
"2026-01-01":"元旦",
"2026-02-16":"除夕",
"2026-02-17":"春節",
"2026-02-18":"春節",
"2026-02-19":"春節",
"2026-02-20":"春節",
"2026-02-28":"和平紀念日",
"2026-04-04":"兒童節",
"2026-04-05":"清明節",
"2026-05-01":"勞動節",
"2026-06-19":"端午節",
"2026-09-25":"中秋節",
"2026-10-10":"國慶日"
};

let now=new Date();
let viewYear=now.getFullYear();
let viewMonth=now.getMonth();

const yearSelect=document.getElementById("year");
const monthSelect=document.getElementById("month");

for(let y=2026;y<=2040;y++){
  let o=document.createElement("option");
  o.value=y;
  o.textContent=y+" 年";
  yearSelect.appendChild(o);
}

for(let m=0;m<12;m++){
  let o=document.createElement("option");
  o.value=m;
  o.textContent=(m+1)+" 月";
  monthSelect.appendChild(o);
}

function dateKey(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

/*
 B班基準：
 2026/1/2 為第一個上班日
 做二休二
*/
const baseDate=new Date(2026,0,2);

function isWorkDay(date){
  const a=new Date(
    date.getFullYear(),
    date.getMonth(),
    date.getDate()
  );
  let diff=Math.floor((a-baseDate)/86400000);
  diff=((diff%4)+4)%4;
  return diff===0 || diff===1;
}

function shiftType(date){
  const m=date.getMonth()+1;

  if(
    m===1 || m===2 ||
    m===5 || m===6 ||
    m===9 || m===10
  ){
    return "夜班";
  }
  return "早班";
}

function shiftTime(date){
  if(shiftType(date)==="早班"){
    return "08:00 ～ 20:10";
  }
  return "20:00 ～ 翌日 08:10";
}

function lunarText(date){
  /*
   Safari 支援 Chinese Calendar。
   顯示農曆月日。
  */
  try{
    return new Intl.DateTimeFormat(
      "zh-TW-u-ca-chinese",
      {month:"short",day:"numeric"}
    ).format(date);
  }catch(e){
    return "";
  }
}

function render(){
  yearSelect.value=viewYear;
  monthSelect.value=viewMonth;

  document.getElementById("monthTitle").textContent=
    `${viewYear} 年 ${viewMonth+1} 月`;

  const cal=document.getElementById("calendar");
  cal.innerHTML="";

  const first=new Date(viewYear,viewMonth,1);
  const last=new Date(viewYear,viewMonth+1,0);

  for(let i=0;i<first.getDay();i++){
    let e=document.createElement("div");
    e.className="day empty";
    cal.appendChild(e);
  }

  for(let d=1;d<=last.getDate();d++){
    const date=new Date(viewYear,viewMonth,d);
    const key=dateKey(date);
    const work=isWorkDay(date);

    let box=document.createElement("div");
    box.className="day "+(work?"work":"rest");

    if(holidays[key]){
      box.classList.add("holiday");
    }

    const today=new Date();

    if(
      date.getFullYear()===today.getFullYear() &&
      date.getMonth()===today.getMonth() &&
      date.getDate()===today.getDate()
    ){
      box.classList.add("today");
    }

    box.innerHTML=
      `<div class="num">${d}</div>
       <div class="status">
       ${work ? "上班・"+shiftType(date) : "休息"}
       </div>
       <div class="lunar">${lunarText(date)}</div>`;

    box.onclick=()=>showDetail(date);
    cal.appendChild(box);
  }
}

function showDetail(date){
  const key=dateKey(date);
  const work=isWorkDay(date);
  let html=`<div class="big">
    ${date.getFullYear()}年${date.getMonth()+1}月${date.getDate()}日
  </div>`;

  html+=`<div>農曆：${lunarText(date)}</div>`;

  if(holidays[key]){
    html+=`<div style="color:#ff7676">
      🇹🇼 ${holidays[key]}
    </div>`;
  }

  if(work){
    const shift=shiftType(date);
    const alarm=
      shift==="早班"
      ?localStorage.getItem("dayAlarm")||"05:50"
      :localStorage.getItem("nightAlarm")||"17:50";

    html+=`
      <div>班別：<b>${shift}</b></div>
      <div>上班時間：${shiftTime(date)}</div>
      <div>⏰ 建議鬧鐘：${alarm}</div>
    `;
  }else{
    html+=`<div>今天：<b>休息</b></div>`;
  }

  document.getElementById("detail").innerHTML=html;

  const saved=localStorage.getItem("note-"+key)||"";
  document.getElementById("note").value=saved;
  document.getElementById("note").dataset.date=key;
}

function saveNote(){
  const n=document.getElementById("note");
  const key=n.dataset.date||dateKey(new Date());
  localStorage.setItem("note-"+key,n.value);
  alert("記事已儲存");
}

function saveAlarm(){
  const day=document.getElementById("dayAlarm").value;
  const night=document.getElementById("nightAlarm").value;

  localStorage.setItem("dayAlarm",day);
  localStorage.setItem("nightAlarm",night);

  alert("鬧鐘時間已儲存");
}

function loadAlarm(){
  document.getElementById("dayAlarm").value=
    localStorage.getItem("dayAlarm")||"05:50";

  document.getElementById("nightAlarm").value=
    localStorage.getItem("nightAlarm")||"17:50";
}

function prevMonth(){
  viewMonth--;
  if(viewMonth<0){
    viewMonth=11;
    viewYear--;
  }

  if(viewYear<2026){
    viewYear=2026;
    viewMonth=0;
  }

  render();
}

function nextMonth(){
  viewMonth++;

  if(viewMonth>11){
    viewMonth=0;
    viewYear++;
  }

  if(viewYear>2040){
    viewYear=2040;
    viewMonth=11;
  }

  render();
}

function goToday(){
  const t=new Date();
  viewYear=t.getFullYear();
  viewMonth=t.getMonth();
  render();
  showDetail(t);
}

function changeYM(){
  viewYear=parseInt(yearSelect.value);
  viewMonth=parseInt(monthSelect.value);
  render();
}

loadAlarm();
render();
goToday();
</script>

</body>
</html>
